<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>✨ 92cos最新地址发布页 ✨</title>


<style>


*{
    box-sizing:border-box;
}


body{

    margin:0;

    min-height:100vh;

    font-family:
    "Microsoft YaHei",
    "Arial Rounded MT Bold",
    sans-serif;


    background:
    linear-gradient(
        135deg,
        #ffd6ec,
        #d9f4ff
    );


    color:#555;

}



/* 顶部 */


.header{

    text-align:center;

    padding:40px 20px 20px;

}



.logo{

    font-size:42px;

    animation:
    float 3s infinite ease-in-out;

}



@keyframes float{

    50%{

        transform:
        translateY(-10px);

    }

}



.title{

    font-size:28px;

    color:#ff6fae;

    text-shadow:
    2px 2px #fff;

}



.desc{

    margin-top:10px;

    color:#888;

}




/* 按钮 */


button{

    border:none;

    background:#ff8fc1;

    color:white;

    padding:
    10px 25px;


    border-radius:30px;

    cursor:pointer;

    margin-top:15px;

    font-size:14px;

}


button:hover{

    background:#ff659f;

}




/* 内容 */


.container{

    max-width:700px;

    margin:auto;

    padding:20px;

}




ul{

    padding:0;

    list-style:none;

}



/* 地址卡片 */


.url-card{


    background:
    rgba(255,255,255,.85);


    border-radius:25px;


    padding:18px;


    margin-bottom:18px;


    display:flex;


    align-items:center;


    justify-content:space-between;



    box-shadow:


    0 10px 25px

    rgba(255,150,200,.25);



    transition:.3s;


    text-decoration:none;


    color:inherit;


    cursor:pointer;


}



.url-card:hover{


    transform:
    translateY(-5px);


}



.url-card:active{


    transform:
    scale(.97);


}





.left{


    display:flex;


    align-items:center;


    gap:15px;


}




.icon{


    width:55px;


    height:55px;


    border-radius:50%;


    background:#ffe1f0;


    display:flex;


    justify-content:center;


    align-items:center;


    font-size:28px;


}




.name{


    font-size:18px;


    color:#ff5797;


    font-weight:bold;


}



.url{


    margin-top:5px;


    font-size:13px;


    color:#999;


    word-break:break-all;


}




/* 状态 */


.status-badge{

    padding:6px 15px;

    border-radius:20px;

    font-size:13px;

    color:white;

    white-space:nowrap;

    display:flex;

    align-items:center;

    gap:5px;

}



/* 检测动画 */

.status-checking{

    background:#9fc8ff;

}



.loading-icon{


    width:12px;

    height:12px;


    border-radius:50%;


    border:

    2px solid rgba(255,255,255,.5);


    border-top-color:white;


    animation:

    spin .8s linear infinite;


}



@keyframes spin{


    from{

        transform:rotate(0deg);

    }


    to{

        transform:rotate(360deg);

    }


}



.check-text{


    animation:

    blink 1.2s infinite;

}



@keyframes blink{


    50%{

        opacity:.5;

    }


}



.status-normal{


    background:#7bdc9a;


}



.status-error{


    background:#ff7f9d;


}




.disabled{


    opacity:.55;


    filter:grayscale(.5);


}





/* 底部 */


.footer{


    text-align:center;


    padding:30px;


    color:#999;


}




@media(max-width:500px){


    .url-card{


        padding:15px;


    }


    .name{

        font-size:16px;

    }


    .status-badge{


        padding:

        5px 10px;

        font-size:12px;

    }


}


</style>


</head>


<body>



<div class="header">


    <div class="logo">

        🐰🌸

    </div>



    <div class="title">

        92cos最新地址发布页

    </div>



    <div class="desc">

        自动检测线路状态 ✨

    </div>



    <button onclick="checkAllUrls()">

        🔍 立即检测

    </button>



</div>





<div class="container">


<ul id="url-list">



<a class="url-card"

   href="https://92cos.com"

   target="_blank"

   data-url="https://92cos.com">



<div class="left">


<div class="icon">

🌸

</div>



<div>


<div class="name">

主站地址

</div>



<div class="url">

92cos.com

</div>



</div>


</div>



<div class="status-badge">

检测中

</div>



</a>






<a class="url-card"

   href="https://929211.xyz"

   target="_blank"

   data-url="https://929211.xyz">



<div class="left">


<div class="icon">

🐱

</div>



<div>


<div class="name">

备用线路

</div>



<div class="url">

92 92 11.xyz

</div>



</div>


</div>



<div class="status-badge">

检测中

</div>



</a>



</ul>


</div>






<div class="footer">


💗 保持收藏 · 防止迷路 💗


<br>


© 2026 92cos.net


</div>






<script>



function checkUrl(url){


    return new Promise((resolve)=>{


        fetch(url,{

            mode:"no-cors",

            method:"HEAD",

            cache:"no-cache"

        })


        .then(()=>{


            resolve(true);


        })


        .catch(()=>{


            resolve(false);


        });



    });


}





function updateUrlStatus(card,isAccessible){



    const badge =

    card.querySelector(".status-badge");



    if(isAccessible){



        card.classList.remove("disabled");


        card.style.pointerEvents="auto";



        badge.innerHTML="🟢 正常";


        badge.className=

        "status-badge status-normal";



    }

    else{


        card.classList.add("disabled");


        card.style.pointerEvents="none";



        badge.innerHTML="🔴 无法访问";


        badge.className=

        "status-badge status-error";



    }



}





async function checkAllUrls(){


    const cards =

    document.querySelectorAll(

        "#url-list .url-card"

    );



    for(const card of cards){



        const badge =

        card.querySelector(

            ".status-badge"

        );



        // 开始检测动画

        badge.className =

        "status-badge status-checking";



        badge.innerHTML = `

            <span class="loading-icon"></span>

            <span class="check-text">

            检测中

            </span>

        `;



        const url =

        card.dataset.url;



        const result =

        await checkUrl(url);



        updateUrlStatus(

            card,

            result

        );


    }


}





// 页面加载检测

checkAllUrls();



// 每5分钟检测

setInterval(

    checkAllUrls,

    5*60*1000

);



</script>



</body>

</html>
