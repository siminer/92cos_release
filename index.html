<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>✨ 92cos地址发布页 ✨</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:
    "Microsoft YaHei",
    "Arial Rounded MT Bold",
    sans-serif;

    background:
    linear-gradient(
        135deg,
        #ffd6ec,
        #d9f4ff
    );

    color:#555;
}


/* 顶部 */

.header{

    text-align:center;
    padding:40px 20px 20px;

}


.logo{

    font-size:42px;
    animation:float 3s infinite ease-in-out;

}


@keyframes float{

    50%{
        transform:translateY(-10px);
    }

}


.title{

    font-size:28px;
    color:#ff6fae;

    text-shadow:
    2px 2px #fff;

}


.desc{

    color:#888;

}


/* 主体 */

.container{

    max-width:700px;
    margin:auto;

    padding:20px;

}



/* 地址卡 */

.url-card{

    background:
    rgba(255,255,255,.8);

    border-radius:25px;

    padding:18px;

    margin-bottom:18px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    box-shadow:

    0 10px 25px
    rgba(255,150,200,.25);

    transition:.3s;

}


.url-card:hover{

    transform:
    translateY(-5px);

}


.left{

    display:flex;

    align-items:center;

    gap:15px;

}


.icon{

    width:55px;
    height:55px;

    border-radius:50%;

    background:#ffe1f0;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:28px;

}


.name{

    font-size:18px;

    color:#ff5797;

    font-weight:bold;

}


.url{

    font-size:13px;

    color:#999;

    word-break:break-all;

}



.status-badge{

    padding:

    6px 15px;

    border-radius:20px;

    font-size:13px;

    color:white;

}


.status-normal{

    background:#7bdc9a;

}


.status-error{

    background:#ff7f9d;

}



.disabled{

    opacity:.55;

    filter:grayscale(.5);

}



/* 底部 */

.footer{

    text-align:center;

    padding:30px;

    color:#999;

}


button{

    border:none;

    background:#ff8fc1;

    color:white;

    padding:10px 25px;

    border-radius:30px;

    cursor:pointer;

    margin-top:15px;

}


button:hover{

    background:#ff659f;

}



</style>


</head>


<body>


<div class="header">

    <div class="logo">🐰🌸</div>

    <div class="title">
        92cos最新地址发布页
    </div>

    <div class="desc">
        自动检测线路状态 ✨
    </div>

    <button onclick="checkAllUrls()">
        🔍 立即检测
    </button>

</div>



<div class="container">


<ul id="url-list" style="padding:0;list-style:none;">


<li class="url-card"
    data-url="https://https://92cos.com">


<div class="left">

<div class="icon">
🌸
</div>


<div>

<div class="name">
主站地址
</div>

<div class="url">
https://92cos.com
</div>


</div>


</div>


<div class="status-badge">
检测中
</div>


</li>





<!-- <li class="url-card"
    data-url="https://92cos.com">


<div class="left">

<div class="icon">
🐱
</div>


<div>

<div class="name">
备用线路
</div>


<div class="url">
https://www.baidu.com
</div>


</div>

</div>


<div class="status-badge">
检测中
</div>


</li> -->



</ul>


</div>



<div class="footer">

💗 保持收藏 · 防止迷路 💗

<br>

© 2026 92cos发布页

</div>



<script>


function checkUrl(url) {

    return new Promise((resolve)=>{


        fetch(url,{
            mode:"no-cors",
            method:"HEAD",
            cache:"no-cache"

        })

        .then(()=>{

            resolve(true);

        })

        .catch(()=>{

            resolve(false);

        });


    });

}



function updateUrlStatus(li,isAccessible){


    const badge =
    li.querySelector(".status-badge");


    if(isAccessible){


        li.classList.remove("disabled");


        badge.innerHTML="🟢 正常";


        badge.className=
        "status-badge status-normal";


    }else{


        li.classList.add("disabled");


        badge.innerHTML="🔴 无法访问";


        badge.className=
        "status-badge status-error";


    }


}




async function checkAllUrls(){


    const items =
    document.querySelectorAll(
        "#url-list li"
    );


    for(const li of items){


        const url =
        li.dataset.url;


        const result =
        await checkUrl(url);


        updateUrlStatus(
            li,
            result
        );


    }


}



// 首次检测

checkAllUrls();


// 5分钟检测

setInterval(
    checkAllUrls,
    5*60*1000
);


</script>


</body>
</html>
